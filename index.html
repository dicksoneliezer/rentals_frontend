<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- ============ Icons ============ -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16x16.png" />
    <link rel="apple-touch-icon" href="/icons/pwa-192x192.png" />
    <link rel="mask-icon" href="/favicon.svg" color="#0a2a4d" />

    <!-- ============ Viewport / mobile ============ -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5"
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#0a2a4d" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#061a30" media="(prefers-color-scheme: dark)" />

    <!-- ============ PWA ============ -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Nipangishe" />
    <meta name="application-name" content="Nipangishe" />
    <meta name="format-detection" content="telephone=no" />

    <!-- ============ SEO / social ============ -->
    <title>Nipangishe — Makazi yako, hatua moja karibu</title>
    <meta
      name="description"
      content="Nipangishe ni jukwaa la kusimamia nyumba na vyumba vya kupangisha: wamiliki husimamia mali zao, wapangaji hupata nyumba, mikataba, malipo na risiti."
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://your-domain.example/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Nipangishe" />
    <meta property="og:title" content="Nipangishe — Makazi yako, hatua moja karibu" />
    <meta
      property="og:description"
      content="Nipangishe ni jukwaa la kusimamia nyumba na vyumba vya kupangisha: wamiliki husimamia mali zao, wapangaji hupata nyumba, mikataba, malipo na risiti."
    />
    <meta property="og:image" content="/icons/pwa-512x512.png" />
    <meta property="og:url" content="https://your-domain.example/" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Nipangishe — Makazi yako, hatua moja karibu" />
    <meta
      name="twitter:description"
      content="Nipangishe ni jukwaa la kusimamia nyumba na vyumba vya kupangisha: wamiliki husimamia mali zao, wapangaji hupata nyumba, mikataba, malipo na risiti."
    />
    <meta name="twitter:image" content="/icons/pwa-512x512.png" />

    <!-- ============ Preconnect (fill in your real API origin) ============ -->
    <!-- <link rel="preconnect" href="https://api.your-domain.example" crossorigin /> -->
    <!-- <link rel="dns-prefetch" href="https://api.your-domain.example" /> -->

    <!-- ============ Splash / theme (prevents white flash) ============ -->
    <style>
      :root {
        color-scheme: light dark;
      }
      html,
      body,
      #root {
        height: 100%;
      }
      body {
        margin: 0;
        background: #0a2a4d;
        color: #fff;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }
      /* Optional: a tiny first-paint spinner while React boots */
      #root:empty::after {
        content: "";
        position: fixed;
        inset: 0;
        margin: auto;
        width: 32px;
        height: 32px;
        border: 3px solid rgba(255, 255, 255, 0.25);
        border-top-color: #fff;
        border-radius: 50%;
        animation: rs-spin 0.8s linear infinite;
      }
      @keyframes rs-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #root:empty::after {
          animation: none;
        }
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <noscript>
      <div
        style="
          padding: 24px;
          font-family: system-ui, sans-serif;
          color: #fff;
          background: #0a2a4d;
          min-height: 100vh;
        "
      >
        <h1>JavaScript is required</h1>
        <p>Please enable JavaScript to use Nipangishe.</p>
      </div>
    </noscript>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
